[platformio]
default_envs = xiao_debug

[env:xiao_debug]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git#1ec1287f8e4bc4067a6fd593991e36875aef989f
board = seeed-xiao-afruitnrf52-nrf52840
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCMW_DIAGNOSTICS=1
    -DCMW_START_ACTIVE=1
    -DCMW_BUILD_PROFILE=\"diagnostic\"

[env:xiao_power]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git#1ec1287f8e4bc4067a6fd593991e36875aef989f
board = seeed-xiao-afruitnrf52-nrf52840
framework = arduino
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCMW_DIAGNOSTICS=0
    -DCMW_START_ACTIVE=0
    -DCMW_BUILD_PROFILE=\"power\"

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter =
    -<*>
    +<device.cpp>
    +<sensor.cpp>
build_flags =
    -std=gnu++17
    -Isrc
    -DCMW_DIAGNOSTICS=0
    -DCMW_START_ACTIVE=0
    -DCMW_BUILD_PROFILE=\"native-test\"
